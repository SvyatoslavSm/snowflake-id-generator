apiVersion: v1
kind: Service
metadata:
  name: {{ include "snowflake-id-generator.fullname" . }}-service
  labels:
    {{- include "snowflake-id-generator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "snowflake-id-generator.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
