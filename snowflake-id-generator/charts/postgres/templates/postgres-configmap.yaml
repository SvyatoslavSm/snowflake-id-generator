{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snowflake-id-generator.fullname" . }}-config
  labels:
    {{- include "snowflake-id-generator.labels" . | nindent 4 }}
    app: postgres
data:
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
{{- end }}
